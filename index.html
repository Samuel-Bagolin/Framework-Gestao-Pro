            width: 100%; 
            border: none; 
            background: transparent; 
            text-align: center; 
            font-size: 12px; 
            outline: none;
        }
        .table-cell-input:focus { 
            background: #f0f9ff; 
            border: 1px solid #3b82f6;

        }

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDoMyEQ4XGpRalbq4midqher6yUEwPd80Y",
            authDomain: "framework-gestao.firebaseapp.com",
            databaseURL: "https://framework-gestao-default-rtdb.firebaseio.com",
            projectId: "framework-gestao",
            storageBucket: "framework-gestao.firebasestorage.app",
            messagingSenderId: "131859838839",
            appId: "1:131859838839:web:6f4b3f2e34fed360b99372",
            measurementId: "G-DXT4DY8RS4"
        };

        // Inicializar Firebase
        let app, database;
        try {
            app = firebase.initializeApp(firebaseConfig);
            database = firebase.database(app);
            console.log("✅ Firebase inicializado com sucesso!");
        } catch (error) {
            console.error("❌ Erro ao inicializar Firebase:", error);
            showToast("Erro de conexão com Firebase", "error");
        }

        // Constantes
        const PRODUCTS = ['sittax', 'openix'];
        const SECTORS = ['agendamento', 'suporte', 'onboarding', 'ongoing', 'retencao'];
        const LOSS_TARGETS = { sittax: 15499.20, openix: 8078.40 };

        // Estado da aplicação
        const state = {
            activeTab: 'dashboard',
            activeSector: 'retencao',
            activeSectorOpenix: 'retencao',
            currentMonth: '',
            monthData: { sittax: {}, openix: {} },
            indicatorConfig: {},
            availableMonths: [],
            isEditMode: false,
            isEditModeOpenix: false,
            isOnline: true,
            modalData: {
                product: 'sittax',
                sector: 'retencao',
                date: new Date().toISOString().split('T')[0],
                values: {}
            },
            unsubscribeFunctions: []
        };

        // ==================== FUNÇÕES DO FIREBASE ====================
        function syncData(path, callback) {
            if (!database) {
                console.error("Database não inicializado");
                showToast("Sem conexão com o banco de dados", "error");
                return () => {};
            }
            
            try {
                const ref = database.ref(path);
                const listener = ref.on('value', (snapshot) => {
                    callback(snapshot.val());
                }, (error) => {
                    console.error(`❌ Erro ao sincronizar dados em ${path}:`, error);
                    showToast("Erro ao carregar dados", "error");
                });
                
                // Armazenar função para cancelar listener
                const unsubscribe = () => ref.off('value', listener);
                state.unsubscribeFunctions.push(unsubscribe);
                
                return unsubscribe;
            } catch (error) {
                console.error("❌ Erro na função syncData:", error);
                return () => {};
            }
        }

        async function updateData(path, data) {
            if (!database) {
                console.error("Database não inicializado");
                showToast("Sem conexão com o banco de dados", "error");
                return false;
            }
            
            try {
                await database.ref(path).update(data);
                console.log(`✅ Dados atualizados em ${path}:`, data);
                return true;
            } catch (error) {
                console.error("❌ Firebase update error:", error);
                showToast("Erro ao salvar dados", "error");
                return false;
            }
        }

        function cleanupListeners() {
            state.unsubscribeFunctions.forEach(fn => fn());
            state.unsubscribeFunctions = [];
        }

        // ==================== FUNÇÕES DE INICIALIZAÇÃO ====================
        function initializeApp() {
            console.log("🚀 Inicializando aplicação...");
            setupMonthSelector();
            loadInitialData();
            setupSectorTabs();
            setActiveTab('dashboard');
            setupConnectionMonitor();
        }

        function setupConnectionMonitor() {
            if (!database) return;
            
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", (snap) => {
                const isConnected = snap.val() === true;
                state.isOnline = isConnected;
                
                const statusEl = document.getElementById('online-status');
                const statusText = document.querySelector('#online-status + span');
                
                if (isConnected) {
                    statusEl.className = "w-2 h-2 rounded-full bg-emerald-500";
                    statusText.textContent = "On-line";
                    console.log("✅ Conectado ao Firebase");
                } else {
                    statusEl.className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
                    statusText.textContent = "Offline";
                    console.log("⚠️ Desconectado do Firebase");
                }
            });
        }

        function setupMonthSelector() {
            const months = [];
            const now = new Date();
            
            // Gerar 24 meses (12 passados e 12 futuros)
            for (let i = -12; i < 12; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const key = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
                const name = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                months.push({ key, name });
            }
            
            // Ordenar do mais recente para o mais antigo
            months.sort((a, b) => b.key.localeCompare(a.key));
            state.availableMonths = months;
            
            // Definir mês atual
            const currentKey = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
            state.currentMonth = currentKey;
            
            // Popular seletor
            const selector = document.getElementById('month-selector');
            selector.innerHTML = months.map(m => 
                `<option value="${m.key}" ${m.key === currentKey ? 'selected' : ''}>${m.name}</option>`
            ).join('');
            
            selector.addEventListener('change', (e) => {
                state.currentMonth = e.target.value;
                cleanupListeners(); // Limpar listeners antigos
                loadMonthData();
                showToast(`Mês alterado para: ${e.target.options[e.target.selectedIndex].text}`, "info");
            });
        }

        function setupSectorTabs() {
            const sittaxTabs = document.getElementById('sector-tabs');
            const openixTabs = document.getElementById('openix-sector-tabs');
            
            if (sittaxTabs) {
                sittaxTabs.innerHTML = SECTORS.map(s => `
                    <button onclick="setActiveSector('${s}', 'sittax')" 
                        class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap sector-tab-sittax-${s} 
                               ${s === state.activeSector ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-200/50'}">
                        ${s.charAt(0).toUpperCase() + s.slice(1)}
                    </button>
                `).join('');
            }
            
            if (openixTabs) {
                openixTabs.innerHTML = SECTORS.map(s => `
                    <button onclick="setActiveSector('${s}', 'openix')" 
                        class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap sector-tab-openix-${s} 
                               ${s === state.activeSectorOpenix ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-200/50'}">
                        ${s.charAt(0).toUpperCase() + s.slice(1)}
                    </button>
                `).join('');
            }
        }

                } else {

        function loadMonthData() {
            if (!state.currentMonth || !database) return;
            
            console.log(`📅 Carregando dados do mês: ${state.currentMonth}`);
            
            syncData(`frameworkGestao/${state.currentMonth}`, (data) => {
                if (data) {
                    state.monthData = {
                        sittax: data.sittax || {},
                        openix: data.openix || {}
                    };
                    console.log("✅ Dados do mês carregados:", state.monthData);
                } else {
                    state.monthData = { sittax: {}, openix: {} };
                    console.log("ℹ️ Nenhum dado encontrado para este mês");
                }
                updateCurrentView();
            });
        }

        // ==================== CONTROLE DE VISUALIZAÇÃO ====================
        function setActiveTab(tab) {
            if (state.activeTab === tab) return;
            
            state.activeTab = tab;
            
            // Atualizar botões ativos
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-xl', 'shadow-indigo-600/30');
                btn.classList.add('hover:bg-slate-800', 'hover:text-white');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.classList.remove('text-white');
                    icon.classList.add('text-slate-500', 'group-hover:text-indigo-400');
                }
            });
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-xl', 'shadow-indigo-600/30');
                activeBtn.classList.remove('hover:bg-slate-800', 'hover:text-white');
                const icon = activeBtn.querySelector('i');
                if (icon) {
                    icon.classList.add('text-white');
                    icon.classList.remove('text-slate-500', 'group-hover:text-indigo-400');
                }
            }
            
            // Esconder todos os conteúdos
            document.getElementById('dashboard-content').classList.add('hidden');
            document.getElementById('sittax-content').classList.add('hidden');
            document.getElementById('openix-content').classList.add('hidden');
            document.getElementById('comparativo-content').classList.add('hidden');
            
            // Mostrar conteúdo ativo
            switch(tab) {
                case 'dashboard':
                    document.getElementById('dashboard-content').classList.remove('hidden');
                    renderDashboard();
                    break;
                case 'sittax':
                    document.getElementById('sittax-content').classList.remove('hidden');
                    setActiveSector(state.activeSector, 'sittax');
                    break;
                case 'openix':
                    document.getElementById('openix-content').classList.remove('hidden');
                    setActiveSector(state.activeSectorOpenix, 'openix');
                    break;
                case 'comparativo':
                    document.getElementById('comparativo-content').classList.remove('hidden');
                    renderComparativo();
                    break;
            }
            
            console.log(`📌 Tab ativa: ${tab}`);
        }

        function setActiveSector(sector, product = 'sittax') {
            if (product === 'sittax') {
                if (state.activeSector === sector) return;
                state.activeSector = sector;
            } else {

        function calculateProductMetrics(product) {
            const metrics = {
                ativos: 0,
                solicitacoes: 0,
                cancelados: 0,
                mrrCancelado: 0,
                revertidos: 0,
                csatAvg: 0,
                csatCount: 0
            };

            const productData = state.monthData[product] || {};
            Object.values(productData).forEach(sectorData => {
                Object.values(sectorData || {}).forEach(dayData => {
                    metrics.ativos += (dayData['Quantidades de Clientes'] || 0);
                    metrics.solicitacoes += (dayData['Solicitações de Cancelamento'] || 0);
                    metrics.cancelados += (dayData['Cancelados'] || dayData['Cancelamentos'] || 0);
                    metrics.mrrCancelado += (dayData['MRR Cancelado (R$)'] || 0);
                    metrics.revertidos += (dayData['Reversão de Cancelamentos'] || dayData['Revertidos'] || 0);
                    
                    if (dayData['CSAT']) {
                        metrics.csatAvg += dayData['CSAT'];
                        metrics.csatCount += 1;
                    }
                });
            });

            return metrics;
        }

        function renderLossSummary(product, metrics) {
            const total = metrics.mrrCancelado || 0;
            const target = LOSS_TARGETS[product] || 1;
            const isOver = total > target;
            const percentage = Math.min((total / target) * 100, 100);

            return `
                <div class="p-8 flex flex-col items-center text-center group hover:bg-slate-50 transition-colors">
                    <span class="text-[11px] font-black ${product === 'sittax' ? 'text-amber-600' : 'text-emerald-600'} uppercase tracking-[0.25em] mb-3">${product.toUpperCase()}</span>
                    <div class="text-2xl font-black mb-1 ${isOver ? 'text-rose-600' : 'text-slate-800'}">
                        R$ ${target.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase">Teto de Churn</div>
                    
                    <div class="mt-6 w-full flex flex-col items-center">
                        <div class="flex justify-between w-full text-[9px] font-black text-slate-400 uppercase mb-1">
                            <span>Consumido</span>
                            <span class="${isOver ? 'text-rose-500' : 'text-emerald-500'}">
                                R$ ${total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                            </span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full ${isOver ? 'bg-rose-500' : 'bg-emerald-500'}" 
                                 style="width: ${percentage}%"></div>
                        </div>

                    </div>
                </div>
            `;
        }

                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Limite Mensal de Perda</p>

                                    </p>
                                </div>
                                <div class="text-[10px] font-black uppercase px-2 py-1 rounded-md ${isOverTarget ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}">

                            </div>

        function renderComparativo() {
            const container = document.getElementById('comparativo-content');
            
            let content = '<div class="grid grid-cols-1 gap-8">';
            
            SECTORS.forEach(sector => {
                const indicators = getUniqueIndicatorsForSector(sector);
                if (indicators.length === 0) return;
                
                content += `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="bg-slate-50 p-6 border-b border-slate-100 flex items-center justify-between">
                            <h3 class="text-lg font-bold text-slate-800 capitalize flex items-center gap-3">
                                <i class="fas fa-layer-group text-indigo-500"></i>

                                Comparação Dinâmica de KPIs
                            </span>

                            <table class="w-full text-sm">

                                        <th class="p-4 text-center text-amber-600">Sittax</th>
                                        <th class="p-4 text-center text-emerald-600">Openix</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${indicators.map(ind => {
                                        const valS = getLatestValue('sittax', sector, ind.name);
                                        const valO = getLatestValue('openix', sector, ind.name);
                                        const isPercentage = ind.type === 'percentual';
                                        const isMoeda = ind.type === 'moeda';

                                        const format = (v) => {
                                            if (v === '-' || v === undefined) return '-';
                                            if (isPercentage) return `${v}%`;
                                            if (isMoeda) return `R$ ${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
                                            return v;
                                        };

                                        return `
                                            <tr class="border-b border-slate-50 last:border-none hover:bg-slate-50/50 transition">
                                                <td class="p-4 text-slate-600 font-bold">${ind.name}</td>
                                                <td class="p-4 text-center text-slate-900 font-black">${format(valS)}</td>
                                                <td class="p-4 text-center text-slate-900 font-black">${format(valO)}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>

                    </div>
                `;
            });
            
            content += '</div>';
            container.innerHTML = content;

        function getUniqueIndicatorsForSector(sector) {
            const names = new Set();
            const typeMap = new Map();
            
            PRODUCTS.forEach(p => {
                (state.indicatorConfig[p]?.[sector] || []).forEach(ind => {
                    names.add(ind.name);
                    typeMap.set(ind.name, ind.type);
                });
            });
            
            return Array.from(names).map(name => ({ name, type: typeMap.get(name) || 'numerico' }));
        }

        function getLatestValue(product, sector, indicatorName) {
            const sData = state.monthData[product]?.[sector];
            if (!sData) return '-';
            const dates = Object.keys(sData).sort();
            if (dates.length === 0) return '-';
            
            // Buscar valor mais recente
            for (let i = dates.length - 1; i >= 0; i--) {
                const val = sData[dates[i]][indicatorName];
                if (val !== undefined) return val;
            }
            
            return '-';
        }

        // ==================== FUNÇÕES DE EDIÇÃO ====================
        async function updateCellValue(product, sector, date, indicatorName, value) {
            const numValue = parseFloat(value);
            if (isNaN(numValue)) return;
            
            const dateObj = new Date(date + 'T12:00:00');
            const dateMonthKey = `${dateObj.getFullYear()}-${(dateObj.getMonth() + 1).toString().padStart(2, '0')}`;
            
            const success = await updateData(`frameworkGestao/${dateMonthKey}/${product}/${sector}/${date}`, { 
                [indicatorName]: numValue 
            });
            
            if (success) {
                // Atualizar estado local
                if (!state.monthData[product][sector]) {
                    state.monthData[product][sector] = {};
                }
                if (!state.monthData[product][sector][date]) {
                    state.monthData[product][sector][date] = {};
                }
                state.monthData[product][sector][date][indicatorName] = numValue;
                
                showToast("Valor atualizado com sucesso", "success");
            }
        }

        async function addIndicator(product, sector) {
            const input = document.getElementById(`new-indicator-${product}`);
            const name = input.value.trim();
            
            if (!name) {
                showToast("Digite um nome para o indicador", "error");
                return;
            }
            
            const newIndicator = {
                id: Date.now().toString(),
                name,
                type: 'numerico'
            };
            
            if (!state.indicatorConfig[product]) state.indicatorConfig[product] = {};
            if (!state.indicatorConfig[product][sector]) state.indicatorConfig[product][sector] = [];
            
            state.indicatorConfig[product][sector].push(newIndicator);
            
            const success = await updateData(`config/indicators/${product}/${sector}`, state.indicatorConfig[product][sector]);
            
            if (success) {
                input.value = '';
                renderSectorTable(product, sector);
                showToast("Indicador adicionado com sucesso", "success");
            }
        }

        async function deleteIndicator(product, sector, id) {
            if (!confirm('Tem certeza que deseja excluir este indicador? Esta ação não pode ser desfeita.')) {
                return;
            }
            
            state.indicatorConfig[product][sector] = state.indicatorConfig[product][sector].filter(i => i.id !== id);
            
            const success = await updateData(`config/indicators/${product}/${sector}`, state.indicatorConfig[product][sector]);
            
            if (success) {
                renderSectorTable(product, sector);
                showToast("Indicador excluído com sucesso", "success");
            }
        }

            `;
        }

        function updateModalProduct(product) {
            state.modalData.product = product;
            state.modalData.sector = 'retencao'; // Reset para setor padrão
            state.modalData.values = {};
            renderModalForm();
        }

        function updateModalSector(sector) {
            state.modalData.sector = sector;
            state.modalData.values = {};
            renderModalForm();
        }

        function updateModalDate(date) {
            state.modalData.date = date;
        }

        function updateModalValue(name, value) {
            state.modalData.values[name] = parseFloat(value) || 0;
        }

        async function saveData() {
            try {
                const indicators = state.indicatorConfig[state.modalData.product]?.[state.modalData.sector] || [];
                if (indicators.length === 0) {
                    showToast("Adicione indicadores a este setor primeiro", "error");
                    return;
                }
                
                // Validar que pelo menos um valor foi preenchido
                const hasValues = Object.keys(state.modalData.values).length > 0;
                if (!hasValues) {
                    showToast("Preencha pelo menos um valor", "error");
                    return;
                }
                
                const dateObj = new Date(state.modalData.date + 'T12:00:00');
                const dateMonthKey = `${dateObj.getFullYear()}-${(dateObj.getMonth() + 1).toString().padStart(2, '0')}`;
                
                const success = await updateData(
                    `frameworkGestao/${dateMonthKey}/${state.modalData.product}/${state.modalData.sector}/${state.modalData.date}`, 
                    state.modalData.values
                );
                
                if (success) {
                    if (dateMonthKey !== state.currentMonth) {
                        state.currentMonth = dateMonthKey;
                        document.getElementById('month-selector').value = dateMonthKey;
                        loadMonthData();
                    } else {
                        // Atualizar dados locais
                        if (!state.monthData[state.modalData.product][state.modalData.sector]) {
                            state.monthData[state.modalData.product][state.modalData.sector] = {};
                        }
                        state.monthData[state.modalData.product][state.modalData.sector][state.modalData.date] = {
                            ...state.monthData[state.modalData.product][state.modalData.sector][state.modalData.date],
                            ...state.modalData.values
                        };
                        updateCurrentView();
                    }
                    
                    closeModal();
                    showToast('Dados salvos com sucesso!', 'success');
                }
            } catch (error) {
                console.error("Erro ao salvar:", error);
                showToast('Erro ao salvar dados. Verifique sua conexão.', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            
            toast.textContent = message;
            toast.className = `fixed top-4 right-4 px-6 py-4 rounded-xl text-white font-bold z-[1000] shadow-lg transform transition-all duration-300 ${
                type === 'success' ? 'bg-emerald-500' : 
                type === 'error' ? 'bg-rose-500' : 
                'bg-indigo-500'
            }`;
            
            toast.classList.remove('hidden');
            toast.classList.add('animate-in');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('opacity-0', 'translate-y-2', 'animate-in');
                }, 300);
            }, 3000);
        }

        // ==================== INICIALIZAÇÃO ====================
        document.addEventListener('DOMContentLoaded', initializeApp);
        
        // Expor funções globalmente para uso nos eventos onclick
        window.setActiveTab = setActiveTab;
        window.setActiveSector = setActiveSector;
        window.toggleEditMode = toggleEditMode;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.saveData = saveData;
        window.updateCellValue = updateCellValue;
        window.addIndicator = addIndicator;
        window.deleteIndicator = deleteIndicator;
        window.updateModalProduct = updateModalProduct;
        window.updateModalSector = updateModalSector;
        window.updateModalDate = updateModalDate;
        window.updateModalValue = updateModalValue;
    </script>
</body>
</html>
