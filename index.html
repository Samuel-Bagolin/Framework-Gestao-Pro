        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        [x-cloak] { display: none !important; }
        .table-cell-input { 
            width: 100%; 
            border: none; 
            background: transparent; 
            text-align: center; 
            font-size: 12px; 
            outline: none;
        }
        .table-cell-input:focus { 
            background: #f0f9ff; 
            border: 1px solid #3b82f6; 
            border-radius: 4px;
        }
        .sector-tab {
            transition: all 0.3s ease;
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .day-cell {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .day-cell:hover {
            background-color: #f3f4f6;
        }
        .day-cell.selected {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .day-cell.has-data {
            background-color: #dbeafe;
            border-color: #93c5fd;
        }

        function syncData(path, callback) {
            if (!database) {
                console.error("Database não inicializado");
                showToast("Sem conexão com o banco de dados", "error");
                return () => {};
            }
            
            try {
                const ref = database.ref(path);
                const listener = ref.on('value', (snapshot) => {
                    callback(snapshot.val());
                }, (error) => {
                    console.error(`❌ Erro ao sincronizar dados em ${path}:`, error);
                    showToast("Erro ao carregar dados", "error");
                });
                
                const unsubscribe = () => ref.off('value', listener);
                state.unsubscribeFunctions.push(unsubscribe);
                return unsubscribe;
            } catch (error) {
                console.error("❌ Erro na função syncData:", error);
                return () => {};
            }
        }

        async function updateData(path, data) {
            if (!database) {
                console.error("Database não inicializado");
                showToast("Sem conexão com o banco de dados", "error");
                return false;
            }
            
            try {
                await database.ref(path).update(data);
                console.log(`✅ Dados atualizados em ${path}`);
                return true;
            } catch (error) {
                console.error("❌ Firebase update error:", error);
                showToast("Erro ao salvar dados", "error");
                return false;
            }
        }

                console.log(`✅ Dados definidos em ${path}`);
                return true;
            } catch (error) {
                console.error("❌ Firebase set error:", error);
                showToast("Erro ao salvar dados", "error");
                return false;
            }
        }

        function cleanupListeners() {
            state.unsubscribeFunctions.forEach(fn => fn());
            state.unsubscribeFunctions = [];
        }

        // ==================== FUNÇÕES DE INICIALIZAÇÃO ====================
        function initializeApp() {
            console.log("🚀 Inicializando aplicação...");
            setupMonthSelector();
            setupSectorTabs();
            loadInitialData();
            setupConnectionMonitor();
        }

        function setupConnectionMonitor() {
            if (!database) return;
            
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", (snap) => {
                const isConnected = snap.val() === true;
                state.isOnline = isConnected;
                
                const statusEl = document.getElementById('online-status');
                const statusText = document.querySelector('#online-status + span');
                
                if (isConnected) {
                    statusEl.className = "w-2 h-2 rounded-full bg-emerald-500";
                    statusText.textContent = "On-line";
                    console.log("✅ Conectado ao Firebase");
                } else {
                    statusEl.className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
                    statusText.textContent = "Offline";
                    console.log("⚠️ Desconectado do Firebase");
                }
            });
        }

        function setupMonthSelector() {
            const months = [];
            const now = new Date();
            
            // Gerar 24 meses (12 passados e 12 futuros)
            for (let i = -12; i < 12; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const key = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
                const name = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                months.push({ key, name });
            }
            
            months.sort((a, b) => b.key.localeCompare(a.key));
            state.availableMonths = months;
            
            const currentKey = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
            state.currentMonth = currentKey;
            
            const selector = document.getElementById('month-selector');
            selector.innerHTML = months.map(m => 
                `<option value="${m.key}" ${m.key === currentKey ? 'selected' : ''}>${m.name}</option>`
            ).join('');
            
            selector.addEventListener('change', (e) => {
                state.currentMonth = e.target.value;
                cleanupListeners();
                loadMonthData();
                showToast(`Mês alterado para: ${e.target.options[e.target.selectedIndex].text}`, "info");
            });
        }

        function setupSectorTabs() {
            const sittaxTabs = document.getElementById('sector-tabs');
            const openixTabs = document.getElementById('openix-sector-tabs');
            
            if (sittaxTabs) {
                sittaxTabs.innerHTML = SECTORS.map(s => `
                    <button onclick="setActiveSector('${s}', 'sittax')" 
                        class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap sector-tab sector-tab-sittax-${s} 
                               ${s === state.activeSector ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-200/50'}">
                        ${s.charAt(0).toUpperCase() + s.slice(1)}
                    </button>
                `).join('');
            }
            
            if (openixTabs) {
                openixTabs.innerHTML = SECTORS.map(s => `
                    <button onclick="setActiveSector('${s}', 'openix')" 
                        class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all whitespace-nowrap sector-tab sector-tab-openix-${s} 
                               ${s === state.activeSectorOpenix ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-200/50'}">
                        ${s.charAt(0).toUpperCase() + s.slice(1)}
                    </button>

        }

        // ==================== CARREGAMENTO DE DADOS ====================
        function loadInitialData() {
            console.log("📊 Carregando dados iniciais...");
            
            // Carregar configuração
            syncData('config/indicators', (data) => {
                if (data) {
                    console.log("✅ Configuração carregada do Firebase");
                    state.indicatorConfig = data;
                } else {
                    console.log("⚠️ Nenhuma configuração encontrada, criando padrão...");
                    createDefaultConfig();
                }
                
                // Carregar dados do mês
                loadMonthData();
            });
        }

        async function createDefaultConfig() {
            console.log("💾 Criando configuração padrão...");
            const success = await setData('config/indicators', DEFAULT_INDICATOR_CONFIG);
            if (success) {
                state.indicatorConfig = JSON.parse(JSON.stringify(DEFAULT_INDICATOR_CONFIG));
                console.log("✅ Configuração padrão criada com sucesso!");
            }
        }

        function loadMonthData() {
            if (!state.currentMonth || !database) return;
            
            console.log(`📅 Carregando dados do mês: ${state.currentMonth}`);
            
            syncData(`frameworkGestao/${state.currentMonth}`, (data) => {
                if (data) {
                    state.monthData = {
                        sittax: data.sittax || {},
                        openix: data.openix || {}
                    };
                    console.log("✅ Dados do mês carregados");
                } else {
                    state.monthData = { sittax: {}, openix: {} };
                    console.log("ℹ️ Nenhum dado encontrado para este mês");
                }
                updateCurrentView();
            });
        }

        // ==================== CONTROLE DE VISUALIZAÇÃO ====================
        function setActiveTab(tab) {
            if (state.activeTab === tab) return;
            
            state.activeTab = tab;
            
            // Atualizar botões ativos
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-xl', 'shadow-indigo-600/30');
                btn.classList.add('hover:bg-slate-800', 'hover:text-white');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.classList.remove('text-white');
                    icon.classList.add('text-slate-500', 'group-hover:text-indigo-400');
                }
            });
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-xl', 'shadow-indigo-600/30');
                activeBtn.classList.remove('hover:bg-slate-800', 'hover:text-white');
                const icon = activeBtn.querySelector('i');
                if (icon) {
                    icon.classList.add('text-white');
                    icon.classList.remove('text-slate-500', 'group-hover:text-indigo-400');
                }
            }
            
            // Esconder todos os conteúdos
            ['dashboard', 'sittax', 'openix', 'comparativo'].forEach(content => {
                const el = document.getElementById(`${content}-content`);
                if (el) el.classList.add('hidden');
            });
            
            // Mostrar conteúdo ativo
            const activeContent = document.getElementById(`${tab}-content`);
            if (activeContent) {
                activeContent.classList.remove('hidden');
            }
            
            updateCurrentView();
        }

        function setActiveSector(sector, product = 'sittax') {
            if (product === 'sittax') {
                if (state.activeSector === sector) return;
                state.activeSector = sector;
            } else {
                if (state.activeSectorOpenix === sector) return;
                state.activeSectorOpenix = sector;
            }
            
            // Atualizar botões de setor
            document.querySelectorAll(`.sector-tab`).forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-500', 'hover:bg-slate-200/50');
            });
            
            const activeBtn = document.querySelector(`.sector-tab-${product}-${sector}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
                activeBtn.classList.remove('text-slate-500', 'hover:bg-slate-200/50');
            }
            
            renderSectorTable(product, sector);
        }

                        btn.classList.add('bg-white', 'border-slate-200', 'text-slate-600');
                        btn.textContent = 'Modo Estrutura';
                    }
                }
            }
            
            const sector = product === 'sittax' ? state.activeSector : state.activeSectorOpenix;
            renderSectorTable(product, sector);

            switch(state.activeTab) {

        function calculateProductMetrics(product) {
            const metrics = {
                ativos: 0,
                solicitacoes: 0,
                cancelados: 0,
                mrrCancelado: 0,
                revertidos: 0,
                csatAvg: 0,
                csatCount: 0
            };

            const productData = state.monthData[product] || {};
            Object.values(productData).forEach(sectorData => {
                Object.values(sectorData || {}).forEach(dayData => {
                    // Soma para métricas gerais
                    metrics.ativos += (parseFloat(dayData['Quantidades de Clientes']) || 0);
                    metrics.solicitacoes += (parseFloat(dayData['Solicitações de Cancelamento']) || 0);
                    metrics.cancelados += (parseFloat(dayData['Cancelamentos']) || 0);
                    metrics.revertidos += (parseFloat(dayData['Reversão de Cancelamentos']) || 0);
                    
                    // CSAT
                    const csatValue = parseFloat(dayData['CSAT']);
                    if (!isNaN(csatValue)) {
                        metrics.csatAvg += csatValue;
                        metrics.csatCount++;
                    }
                    
                    // MRR Cancelado (procurar em vários campos possíveis)
                    const mrrValue = parseFloat(dayData['MBR Cancelado (R$)']) || 
                                    parseFloat(dayData['MBR Cancelado Automático (R$)']) || 0;
                    metrics.mrrCancelado += mrrValue;
                });
            });

            // Calcular média do CSAT
            if (metrics.csatCount > 0) {
                metrics.csatAvg = metrics.csatAvg / metrics.csatCount;
            }

            return metrics;
        }

        async function updateCellValue(product, sector, date, indicatorName, value) {
            const numValue = parseFloat(value);
            
            const dateObj = new Date(date + 'T12:00:00');
            const dateMonthKey = `${dateObj.getFullYear()}-${(dateObj.getMonth() + 1).toString().padStart(2, '0')}`;
            
            let dataToUpdate = {};
            if (isNaN(numValue)) {
                // Remover o campo se estiver vazio
                const currentData = state.monthData[product]?.[sector]?.[date] || {};
                delete currentData[indicatorName];
                dataToUpdate = currentData;
            } else {
                dataToUpdate = { [indicatorName]: numValue };
            }
            
            const success = await updateData(`frameworkGestao/${dateMonthKey}/${product}/${sector}/${date}`, dataToUpdate);
            
            if (success) {
                // Atualizar estado local
                if (!state.monthData[product][sector]) {
                    state.monthData[product][sector] = {};
                }
                if (!state.monthData[product][sector][date]) {
                    state.monthData[product][sector][date] = {};
                }
                
                if (isNaN(numValue)) {
                    delete state.monthData[product][sector][date][indicatorName];
                } else {
                    state.monthData[product][sector][date][indicatorName] = numValue;
                }
                
                updateCurrentView();
                showToast("Valor atualizado com sucesso", "success");
            }
        }

        async function addIndicator(product, sector) {
            const input = document.getElementById(`new-indicator-${product}`);
            const name = input.value.trim();
            
            if (!name) {
                showToast("Digite um nome para o indicador", "error");
                return;
            }
            
            const newIndicator = {
                id: Date.now().toString(),
                name,
                type: 'numerico'
            };
            
            if (!state.indicatorConfig[product]) state.indicatorConfig[product] = {};
            if (!state.indicatorConfig[product][sector]) state.indicatorConfig[product][sector] = [];
            
            state.indicatorConfig[product][sector].push(newIndicator);
            
            const success = await updateData(`config/indicators/${product}/${sector}`, state.indicatorConfig[product][sector]);
            
            if (success) {
                input.value = '';
                renderSectorTable(product, sector);
                showToast("Indicador adicionado com sucesso", "success");
            }
        }

        async function deleteIndicator(product, sector, id) {
            if (!confirm('Tem certeza que deseja excluir este indicador? Esta ação não pode ser desfeita.')) {
                return;
            }
            
            state.indicatorConfig[product][sector] = state.indicatorConfig[product][sector].filter(i => i.id !== id);
            
            const success = await updateData(`config/indicators/${product}/${sector}`, state.indicatorConfig[product][sector]);
            
            if (success) {
                renderSectorTable(product, sector);
                showToast("Indicador excluído com sucesso", "success");
            }
        }

        function getUniqueIndicatorsForSector(sector) {
            const names = new Set();
            const typeMap = new Map();
            
            PRODUCTS.forEach(p => {
                (state.indicatorConfig[p]?.[sector] || []).forEach(ind => {
                    names.add(ind.name);
                    typeMap.set(ind.name, ind.type);
                });
            });
            
            return Array.from(names).map(name => ({ name, type: typeMap.get(name) || 'numerico' }));
        }

        function getLatestValue(product, sector, indicatorName) {
            const sData = state.monthData[product]?.[sector];
            if (!sData) return '-';
            
            // Procurar valores em todos os dias
            let latestValue = '-';
            Object.values(sData).forEach(dayData => {
                if (dayData[indicatorName] !== undefined) {
                    latestValue = dayData[indicatorName];
                }
            });
            
            return latestValue;
        }

        async function saveData() {
            try {
                const indicators = state.indicatorConfig[state.modalData.product]?.[state.modalData.sector] || [];
                if (indicators.length === 0) {
                    showToast("Configure indicadores para este setor primeiro", "error");
                    return;
                }
                
                if (Object.keys(state.modalData.values).length === 0) {
                    showToast("Preencha pelo menos um valor", "error");
                    return;
                }
                
                const dateMonthKey = `${state.modalData.year}-${state.modalData.month.toString().padStart(2, '0')}`;
                
                // Obter dados atuais para não sobrescrever
                const currentData = state.monthData[state.modalData.product]?.[state.modalData.sector]?.[state.modalData.date] || {};
                
                // Combinar dados
                const dataToSave = { ...currentData, ...state.modalData.values };
                
                const success = await updateData(
                    `frameworkGestao/${dateMonthKey}/${state.modalData.product}/${state.modalData.sector}/${state.modalData.date}`, 
                    dataToSave
                );
                
                if (success) {
                    // Atualizar estado local
                    if (!state.monthData[state.modalData.product]) {
                        state.monthData[state.modalData.product] = {};
                    }
                    if (!state.monthData[state.modalData.product][state.modalData.sector]) {
                        state.monthData[state.modalData.product][state.modalData.sector] = {};
                    }
                    state.monthData[state.modalData.product][state.modalData.sector][state.modalData.date] = dataToSave;
                    
                    // Atualizar o seletor de mês principal se for diferente
                    if (dateMonthKey !== state.currentMonth) {
                        state.currentMonth = dateMonthKey;
                        document.getElementById('month-selector').value = dateMonthKey;
                        loadMonthData();
                        showToast(`Dados salvos para ${dateMonthKey}. Mês alterado automaticamente.`, 'success');
                    } else {
                        updateCurrentView();
                        showToast('Dados salvos com sucesso!', 'success');
                    }
                    
                    closeModal();
                    
                    // Navegar para a tabela do produto salvo
                    if (state.modalData.product === 'sittax') {
                        setActiveTab('sittax');
                        setActiveSector(state.modalData.sector, 'sittax');
                    } else {
                        setActiveTab('openix');
                        setActiveSector(state.modalData.sector, 'openix');
                    }
                }
            } catch (error) {
                console.error("Erro ao salvar:", error);
                showToast('Erro ao salvar dados. Verifique sua conexão.', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            
            toast.textContent = message;
            toast.className = `fixed top-4 right-4 px-6 py-4 rounded-xl text-white font-bold z-[1000] shadow-lg transform transition-all duration-300 ${
                type === 'success' ? 'bg-emerald-500' : 
                type === 'error' ? 'bg-rose-500' : 
                'bg-indigo-500'
            }`;
            
            toast.classList.remove('hidden');
            toast.classList.add('animate-in');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('opacity-0', 'translate-y-2', 'animate-in');
                }, 300);
            }, 3000);
        }

        // ==================== INICIALIZAÇÃO ====================
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initializeApp();
                setActiveTab('dashboard');
            }, 100);
        });

        // Expor funções globalmente
        window.setActiveTab = setActiveTab;
        window.setActiveSector = setActiveSector;
        window.toggleEditMode = toggleEditMode;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.saveData = saveData;
        window.updateCellValue = updateCellValue;
        window.addIndicator = addIndicator;
        window.deleteIndicator = deleteIndicator;
        window.updateModalProduct = updateModalProduct;
        window.updateModalSector = updateModalSector;
        window.updateModalYear = updateModalYear;
        window.updateModalMonth = updateModalMonth;
        window.selectModalDate = selectModalDate;
        window.updateModalValue = updateModalValue;
    </script>
</body>
</html>
